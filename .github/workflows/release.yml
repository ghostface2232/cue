# Builds the clean, per-user installer and creates a DRAFT GitHub Release whenever a version
# tag (e.g. v0.1.0) is pushed. The draft carries the installer asset and auto-generated notes as a
# starting point; writing the final notes and publishing the release are done manually.
#
# The tag must match Cue.csproj's <Version> prefixed with "v" (the build verifies this). The
# installer is produced by build-installer.ps1: a self-contained, unpackaged WinUI 3 publish
# (.NET + Windows App SDK bundled) with the VC++ runtime added app-local, packaged by Inno Setup.
#
# Local alternative: pwsh -File build-installer.ps1 (then attach dist\CueSetup-win-x64.exe by hand).
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify tag matches Cue.csproj <Version>
        shell: pwsh
        run: |
          [xml]$proj = Get-Content Cue.csproj
          $version = @($proj.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($version -ne $tag) {
            throw "Tag '$tag' does not match Cue.csproj <Version> '$version'. Bump <Version> or retag."
          }
          Write-Host "Version $version matches tag ${{ github.ref_name }}."

      - name: Verify Package.appxmanifest version matches Cue.csproj <Version>
        shell: pwsh
        # Same principle as the tag check: csproj <Version> is the single source of truth, and the MSIX
        # (Store channel) manifest version is that three-part value with ".0" appended. Fail the build on
        # drift so the two channels can never ship mismatched versions.
        run: |
          [xml]$proj = Get-Content Cue.csproj
          $version = @($proj.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
          $expected = "$version.0"
          [xml]$manifest = Get-Content Package.appxmanifest
          $manifestVersion = $manifest.Package.Identity.Version
          if ($manifestVersion -ne $expected) {
            throw "Package.appxmanifest Identity/Version '$manifestVersion' must be '$expected' (Cue.csproj <Version> '$version' + '.0'). Update the manifest."
          }
          Write-Host "Manifest version $manifestVersion matches <Version> $version."

      - name: Verify Package.appxmanifest assets exist
        shell: pwsh
        # Missing visual-asset files are not caught at packaging time — they surface only during Store
        # certification, a slow and late feedback loop. Assert here that every asset the manifest
        # references resolves to a file on disk, accepting scale-/targetsize-qualified variants
        # (e.g. a "Assets\Square150x150Logo.png" reference is satisfied by "Square150x150Logo.scale-200.png").
        run: |
          $text = Get-Content Package.appxmanifest -Raw
          $refs = [regex]::Matches($text, 'Assets\\[^"<>]+?\.(?:png|ico|jpg)') |
            ForEach-Object { $_.Value } | Sort-Object -Unique
          $missing = @()
          foreach ($ref in $refs) {
            $dir = Split-Path $ref -Parent
            $base = [IO.Path]::GetFileNameWithoutExtension($ref)
            $ext = [IO.Path]::GetExtension($ref)
            $exact = Test-Path $ref
            $variants = Get-ChildItem -Path $dir -Filter "$base*$ext" -ErrorAction SilentlyContinue
            if (-not $exact -and -not $variants) { $missing += $ref }
          }
          if ($missing) {
            throw "Package.appxmanifest references assets with no matching file (base or scale/targetsize variant): $($missing -join ', ')"
          }
          Write-Host "All $($refs.Count) manifest-referenced assets present."

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: pwsh -File build-installer.ps1

      - name: Compute installer checksum
        shell: pwsh
        # The in-app updater verifies the download against this SHA-256 before launching it. Written in
        # the "<hex>  <filename>" (sha256sum) shape; the updater reads the first 64-hex token.
        run: |
          $exe = "dist/CueSetup-win-x64.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  CueSetup-win-x64.exe" | Set-Content -NoNewline -Path "$exe.sha256"
          Write-Host "SHA-256: $hash"

      - name: Verify published assets (Smoke Test)
        shell: pwsh
        run: |
          $publishDir = "bin/Release/net10.0-windows10.0.26100.0/win-x64/publish"; @("Assets/AppIcon.ico", "Assets/AppIconTitle.png", "Assets/Fonts/PretendardJP-Medium.otf", "Assets/Fonts/PretendardJP-Regular.otf", "Assets/Fonts/PretendardJP-SemiBold.otf") | ForEach-Object { if (-not (Test-Path "$publishDir/$_")) { throw "Missing asset in publish folder: $_" } }

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates a DRAFT release with the installer asset + auto-generated notes as a starting
        # point — final notes and publishing are done manually. Idempotent: if a release/draft for
        # this tag already exists, just replace the asset instead of failing.
        run: >
          gh release create "${{ github.ref_name }}" dist/CueSetup-win-x64.exe dist/CueSetup-win-x64.exe.sha256
          --title "${{ github.ref_name }}" --draft --generate-notes
          || gh release upload "${{ github.ref_name }}" dist/CueSetup-win-x64.exe dist/CueSetup-win-x64.exe.sha256 --clobber
